name: LeetCode card

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render card
        run: |
          python3 .github/scripts/c.py
      - name: Commit if changed
        run: |
          if [ ! -f leetcode.svg ]; then echo "API unavailable - keeping existing card"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leetcode.svg
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: refresh LeetCode card"
          git push

