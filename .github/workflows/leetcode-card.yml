name: LeetCode card

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render card
        run: python3 .github/scripts/render_card.py
      - name: Publish to assets branch
        run: |
          if [ ! -f leetcode.svg ]; then echo "no card produced, skipping"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan assets-tmp
          git rm -rf --cached . >/dev/null
          git add -f leetcode.svg
          git commit -m "chore: refresh LeetCode card"
          git push -f origin assets-tmp:assets
